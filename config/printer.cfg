#####           CharminULTRA Prusa MK3S+ Klipper Config Template

##### ***********REVIEW THE README INSTRUCTIONS FOR ALL STEPS***************

# Uncomment the necessary items as you walk through this file. Many are already uncommented. Look for TUNE ME for important areas to tune to your specific printer.
# TUNING STEPS ARE NOT OPTIONAL.

### LCD MENU EXTRAS - one module bundling the old sdcard_menu_sort.py features
# Requires klipper_modules/mk3s_menu_extras.py copied to the host's
# klippy/extras/ directory, then a Klipper restart.
# Provides:
#   - SD-card file list sorted by mtime (newest first) + subfolder navigation
#   - "Cancel Object" list menu type (exclobjlist)
#   - Encoder-wheel print speed adjust on the main screen while printing
#   - GET_HOST_IP (used by Support > IP on the LCD)
#   - PUSH_MENU (opens an LCD menu programmatically)
# NOTE: this section must stay above any [display]/[menu] sections - the
# module registers the "exclobjlist" menu type used by the Cancel Object menu.
[mk3s_menu_extras]
#scroll_interval: 0.04  # min seconds between scroll ticks
#speed_step: 0.01    # wheel speed change per click (printing)
#speed_fast_step: 0.25  # wheel speed change per fast scroll (printing)
#speed_min: 0.1      # min speed factor allowed by the wheel
#speed_max: 5.0      # max speed factor allowed by the wheel
#speed_deadzone: 3   # wheel clicks to ignore before speed changes start
#speed_deadzone_timeout: 0.5  # seconds to reset the wheel deadzone

