# WARNING: DO NOT EDIT THIS FILE UNLESS YOU KNOW WHAT YOU ARE DOING

#Start of Charmin's additions:

# Apply the Z offset saved for the currently selected bed sheet. Reads
# selected_bed and its *_offset from save_variables and applies it as the
# gcode Z offset. Called at boot (BED_OFFSET_APPLY), at print start, and by
# the sheet-select menus.
[gcode_macro APPLY_BED_OFFSET]
description: Apply the saved Z offset for the currently selected bed sheet
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set sel = sv.selected_bed | default('smooth') %}
    {% set off = sv.smooth_offset | default(0.0) if sel == 'smooth' else (sv.textured_offset | default(0.0) if sel == 'textured' else (sv.satin_offset | default(0.0))) %}
    {% set move = params.MOVE|default(0)|int %}
    SET_GCODE_OFFSET Z={off} MOVE={move}

# Print Start
[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set BED_CAL_TEMP = params.BED_CAL_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(215)|float %}
    {% set EXTRUDER_CAL_TEMP = params.EXTRUDER_CAL_TEMP|default(170)|int %} ; 170*C gets common filaments like PETG, PLA, and ASA/ABS nice and soft without oozing.
    {% set PRINTER_MODEL = params.PRINTER_MODEL|default("MK3S+")|string %}
    {% set FILAMENT_TYPE = params.FILAMENT_TYPE|default("PLA")|string %}

    ; Make sure the MK3S+ uses the bed temp as the calibration temp since SuperPINDA has internal compensation
    {% if PRINTER_MODEL == "MK3S+" %}
        {% set BED_CAL_TEMP = BED_TEMP %}
    {% endif %}

    ; using TEMPERATURE_WAIT instead of M109/M190 speeds up the startup time by minutes. Klipper seems to wait
    ; with very little hysteresis and especially with the bed, this can take a long time.

    M220 S100                        ; Reset print speed to 100%
    SET_GCODE_VARIABLE MACRO=ACCEL_STATE VARIABLE=mult VALUE=1.0 ; Reset Tune accel multiplier to default
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} ; Reset runtime accel limit to config default
    M117 Preheating...
    M140 S{BED_CAL_TEMP}             ; Start bed heating and don't wait
    M104 S{EXTRUDER_CAL_TEMP}        ; Start heating extruder and don't wait. Saves time later between bed mesh calibration and purge.
    APPLY_BED_OFFSET                 ; Apply the selected sheet's saved Z offset
    BED_MESH_CLEAR                   ; Clear bed mesh
    G28                              ; Home the printer
    G90                              ; Absolute positioning mode
    G0 Z50 F4000                     ; Raise up a bit for any nozzle cleaning while the bed heats (and keep PINDA cool)
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_CAL_TEMP-1} MAXIMUM={BED_CAL_TEMP+3}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_CAL_TEMP-1} MAXIMUM={EXTRUDER_CAL_TEMP+5}
    {% if PRINTER_MODEL == 'MK3S' or PRINTER_MODEL == "MK3" %}
        ; This is a poor way of utilizing PINDA. Normally one would want to calibrate it and store those values.
        ; Prusa implements calibration of temp vs offset and storage/retrival of those values in EEPROM.
        ; So for a lack of that, just always do bed mesh at the same temp.
        G0 X20 Y60 Z0.15             ; Move to pinda preheat position (based on calibration position in MK3/3S firmware)
        {% for timer in range(45,0,-1) %}
            M117 PINDA Heatsoak...{timer|int}
            G4 P1000
        {% endfor %}
    {% endif %}
    M117 Probing bed...
    BED_MESH_CALIBRATE ADAPTIVE=1    ; Measure bed mesh
    M117 Heating...
    M140 S{BED_TEMP}                 ; Start heating bed to final temp and don't wait 
    M104 S{EXTRUDER_TEMP}            ; Start heating extruder to final temp and don't wait
    G0 X0 Y-4 Z15 F4000              ; move to the purge starting position
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP-1} MAXIMUM={BED_TEMP+3}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP-1} MAXIMUM={EXTRUDER_TEMP+5}
    M117                             ; Clear message on LCD
    PRUSA_LINE_PURGE                 ; Purge and then ready to go
    #LINE_PURGE                      ; You can use this instead of PRUSA_LINE_PURGE if you install KAMP 
    #SKEW_PROFILE LOAD=CaliFlower


# Print End
[gcode_macro PRINT_END]
gcode:
    SET_GCODE_VARIABLE MACRO=ACCEL_STATE VARIABLE=mult VALUE=1.0 ; Reset Tune accel multiplier so it does not leak into non-print ops
    SET_VELOCITY_LIMIT ACCEL={printer.configfile.settings.printer.max_accel} ; Restore runtime accel limit to config default
    #SET_SKEW CLEAR=1
    M83 ; extruder relative mode
    G1 E-4 ; retract filament a bit for minimizing ooze
    _TOOLHEAD_PARK_PAUSE_CANCEL    ; Park
    G90 ; absolute positioning
    G0 Z{[printer.toolhead.position.z, 50]|max} F300 ; park at least 50mm off the bed
    M84 X Y E    ; Disable steppers
    TURN_OFF_HEATERS    ; Disable heaters
    M106 S0     ; Disable fans
    BED_MESH_CLEAR    ; Clear bed mesh

# Run the end-print routine when a print is cancelled. The UI cancel
# buttons (Mainsail/Fluidd and the LCD "Cancel printing" menu) send
# CANCEL_PRINT, which by default just stops the print in place. Override
# it so a cancel parks, retracts, and shuts down like a normal print end.
[gcode_macro CANCEL_PRINT]
rename_existing: _CANCEL_PRINT_BASE
description: Cancel the print and run the end-print routine
gcode:
    PRINT_END
    _CANCEL_PRINT_BASE




[gcode_macro PRUSA_LINE_PURGE]
## Purge line macro based on the MK4
gcode:
    SAVE_GCODE_STATE NAME=prusa_line_purge
    M83 ; extruder relative mode
    G0 X0 Y-4 Z15 F4000; move to the purge starting position
    G92 E0 ; reset extruder position
    G1 E3 ; prime hotend
    G0 E7 X15 Z0.2 F500 ; purge
    G0 X25 E4 F500 ; purge
    G0 X35 E4 F650 ; purge
    G0 X45 E4 F800 ; purge
    G0 X48 Z0.05 F8000 ; wipe, move close to the bed
    G0 X51 Z0.2 F8000 ; wipe, move quickly away from the bed
    RESTORE_GCODE_STATE NAME=prusa_line_purge
    G92 E0 ; reset extruder position



[force_move]
enable_force_move: true ; enable FORCE_MOVE and SET_KINEMATIC_POSITION



## Macros below obtained from origina dz0ny repository

# Store the slicer's remaining-time estimate. PrusaSlicer/SuperSlicer emit
# "M73 P<percent> R<remaining minutes>" during a print; this captures R so the
# LCD can show it alongside Klipper's own estimate. Requires the slicer to
# emit M73 (PrusaSlicer: Print Settings -> Output -> Print Time Estimate = M73).
[gcode_macro M73]
rename_existing: M73.1
description: Store remaining print time (R, minutes) and progress (P) from slicer
variable_r: 0
variable_p: 0
gcode:
    {% set R = params.R|default(0)|int %}
    {% set P = params.P|default(0)|int %}
    {% if R > 0 %}
        SET_GCODE_VARIABLE MACRO=M73 VARIABLE=r VALUE={R}
    {% endif %}
    {% if P > 0 %}
        SET_GCODE_VARIABLE MACRO=M73 VARIABLE=p VALUE={P}
    {% endif %}

[gcode_macro M486]
gcode:
    CLEAR_PAUSE

[gcode_macro G80]
gcode:
    M117 Bed leveling
    BED_MESH_CALIBRATE
    G1 X0 Y0 Z0.4 F4000
    M117
    M400

[gcode_macro G81]
gcode:
 BED_MESH_OUTPUT
 
[gcode_macro M300]
gcode:
    # Use a default 1kHz tone if S is omitted.
    {% set S = params.S|default(1000)|int %}
    # Use a 10ms duration is P is omitted.
    {% set P = params.P|default(100)|int %}
    # BEEPER_pin uses scale 1000, so 50% duty == VALUE 500.
    SET_PIN PIN=BEEPER_pin VALUE=500 CYCLE_TIME={ 1.0/S if S > 0 else 1 }
    G4 P{P}
    SET_PIN PIN=BEEPER_pin VALUE=0
    

[delayed_gcode clear_display]
initial_duration: 0.
gcode:
  M117



# Prusa's calibrate Z
[gcode_macro Calibrate_Z]
description: Calibrate Z axis
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    G1 X20 Y0
    G1 Z{max_z-10} F2000 #Update with Z height.
    FORCE_MOVE STEPPER=stepper_z Distance=20 Velocity=10
    G1 Z{max_z-50} F2000 # Move down
    G28 # Home again

[gcode_macro PREHEAT_PLA]
gcode:
    # Start bed heating
    M140 S60
    # Start nozzle heating
    M104 S200

[gcode_macro PREHEAT_PETG]
gcode:
    # Start bed heating
    M140 S90
    # Start nozzle heating
    M104 S240

[gcode_macro PREHEAT_TPU]
gcode:
    # Start bed heating
    M140 S50
    # Start nozzle heating
    M104 S190

# Live acceleration multiplier for the Tune menu (0.5 = 50%, 2.0 = 200%).
# M204 scales every slicer accel request by this; PRINT_START resets it to
# 1.0 at the start of each print. Only affects the runtime accel limit, never
# the [printer] max_accel stored in config.
[gcode_macro ACCEL_STATE]
variable_mult: 1.0
gcode:

[gcode_macro SET_ACCEL_MULT]
description: Set the print acceleration multiplier (used by the Tune menu and M204 override)
gcode:
    {% set mult = params.MULT|default(1.0)|float %}
    SET_GCODE_VARIABLE MACRO=ACCEL_STATE VARIABLE=mult VALUE={mult}

# Marlin compatibility macros - handles Marlin-style G-code from slicers
[gcode_macro M204]
rename_existing: M204.1
description: Scale slicer M204 acceleration requests by the live Tune multiplier
gcode:
    {% set mult = printer["gcode_macro ACCEL_STATE"].mult|float %}
    {% set S = params.S|default(printer.configfile.settings.printer.max_accel)|float %}
    {% set P = params.P|default(S)|float %}
    {% set T = params.T|default(S)|float %}
    {% set accel = [P, T]|min * mult %}
    {% if accel > 0 %}
        SET_VELOCITY_LIMIT ACCEL={'%.1f' % accel}
    {% endif %}

[gcode_macro M205]
gcode:
    {% set X = params.X|default(5)|float %}
    {% set Y = params.Y|default(5)|float %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={[X,Y]|min}

# M572 - Prusa firmware pressure advance (S parameter = advance factor)
[gcode_macro M572]
gcode:
    {% if params.S is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.S}
    {% endif %}

# M900 - Marlin linear advance (K parameter = advance factor)
[gcode_macro M900]
gcode:
    {% if params.K is defined %}
        SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}

# Auto-start prints from the LCD SD Card menu. Selecting a file in the
# "Print from SD" list sends `M23 /file`, which only loads the file and
# leaves the extra "Start Printing" step. Overriding M23 so a single
# click loads the file AND starts the print immediately.
[gcode_macro M23]
rename_existing: M23.1
description: Select SD file and start printing immediately
gcode:
    {% set fname = rawparams.strip().lstrip('/') %}
    {% if fname %}
        SDCARD_PRINT_FILE FILENAME="{fname}"
    {% endif %}

# Preheat macros for additional materials
[gcode_macro PREHEAT_ASA]
gcode:
    # Start bed heating
    M140 S100
    # Start nozzle heating
    M104 S260

[gcode_macro PREHEAT_ABS]
gcode:
    # Start bed heating
    M140 S100
    # Start nozzle heating
    M104 S255

# Spoolman spool selection macros
[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("spoolman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("Parameter ID is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method("spoolman_set_active_spool", spool_id=None)}

# Color change or filament runout
[gcode_macro M600]
description: Color change or filament runout
gcode:
    # Default to the middle front of the bed. MK4 likes the right side but with the MK3 you might need access
    #  to the idler to unjam filament during a runout. 
    #
    # No Z specified here since PAUSE hands over to _TOOLHEAD_PARK_PAUSE_CANCEL which doesn't take a Z argument.
    # If you want to change the amount of Z lift for parking, change the value of 'custom_park_dz' in mainsail.cfg.
    #
    # If a manual Z move is done, its not possible to know the restore context since this is generally followed
    #  by an asynchronous filament load and resume.
    {% set X = params.X|default(printer.toolhead.axis_maximum.x / 2)|float %}
    {% set Y = params.Y|default(-4)|float %}
    PAUSE X={X} Y={Y}
    UNLOAD_FILAMENT RAM_DISTANCE=7 ; reuse the unload routine so we don't have to maintain two implementations
    M117 Swap filament now

# Filament load / unload
# LOAD_FILAMENT is the fsensor insert trigger (see einsy-rambo.cfg). It hands off to the
# LOAD_WIZARD flow in lcdconfig/macro.cfg so physically pushing filament in drives the same
# procedure as the LCD menus. UNLOAD_FILAMENT is reused by M600 for runout / color changes.

[gcode_macro LOAD_FILAMENT]
description: Load filament by starting the LOAD_WIZARD flow (fsensor auto-load)
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step == 0 and printer.print_stats.state != "printing" %}
        {% set TEMPS = {'PLA': 215, 'PETG': 230, 'ABS': 255, 'ASA': 260, 'PC': 275, 'PVB': 215, 'HIPS': 220, 'PP': 254, 'FLEX': 230} %}
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=type VALUE='"AUTO"'
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=auto VALUE=1
        M104 S{params.TEMP|default(TEMPS.get(w.type, 220))|float}
        M117 Heating for load...
        UPDATE_DELAYED_GCODE ID=heat_loop DURATION=1
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
gcode:
  # Default ram distance and sequence copied from MK3.5 in https://github.com/prusa3d/Prusa-Firmware-Buddy/include/marlin/Configuration_MK3.5_adv.h
  {% set RAM_DISTANCE = params.RAM_DISTANCE|default(20)|int %}
  SAVE_GCODE_STATE NAME=unload_state
  G91
  {% if params.TEMP is defined or printer.extruder.can_extrude|lower == 'false' %}
    M117 Heating...
    # Heat up hotend to provided temp or 220 as default as that should work OK with most filaments.
    M109 S{params.TEMP|default(220, true)}
  {% endif %}
  SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=0
  M117 Unloading filament...
  G92 E0.0                      ; reset extruder distance
  G91                           ; relative positioning
  G1 E{RAM_DISTANCE} F1500      ; ram to build up pressure
  G1 E-50 F2700                 ; fast, long retract to thin the whisp
  G1 E-5 F50                    ; slow retract to break the whisp
  G1 E-50 F1500                 ; move filament past gears
  G92 E0.0                      ; reset extruder distance
  M400                          ; wait for planner to flush
  M117 Remove Filament Now!
  M300 S300 P1000               ; beep
  M117 Filament unloaded!
  RESTORE_GCODE_STATE NAME=unload_state
  SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=1
