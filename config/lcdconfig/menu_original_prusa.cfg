[menu __main __settings __disable]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Disable steppers
gcode:
    M84
    M18
	
[menu __main __settings __offsetz]
type: input
enable: {not printer.idle_timeout.state == "Printing"}
name: Live adjust Z{'%6.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.005
realtime: True
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set sel = sv.selected_bed | default('smooth') %}
  {% set offvar = 'smooth_offset' if sel == 'smooth' else ('textured_offset' if sel == 'textured' else 'satin_offset') %}
  SET_GCODE_OFFSET Z={'%.3f' % menu.input} MOVE=1
  SAVE_VARIABLE VARIABLE={offvar} VALUE={'%.3f' % menu.input}
	
[menu __main __settings __bed_offset]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Z Offset / Sheet

# One entry per surface. Each sheet's offset is a single variable in
# save_variables (saved_variables.cfg): smooth_offset / textured_offset /
# satin_offset. Edit that *_offset number to tune a sheet, then restart.
# Tapping a sheet only records selected_bed and applies that sheet's
# offset; BED_OFFSET_APPLY in printer.cfg restores it after a reboot.
[menu __main __settings __bed_offset __smooth]
type: command
name: {"Smooth PEI  <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "smooth" else "Smooth PEI"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"smooth"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Smooth sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __settings __bed_offset __textured]
type: command
name: {"Textured    <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "textured" else "Textured"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"textured"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Textured sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __settings __bed_offset __satin]
type: command
name: {"Satin       <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "satin" else "Satin"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"satin"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Satin sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

### menu home menu ###
# Home screen layout. Traditional keeps the stock data layout with a single
# slicer-time clock; Enhanced swaps in a denser layout (X/Y/Z, S/K time
# estimates, speed + accel). SET_DISPLAY_GROUP is a runtime command, so it is
# applied here on change and again at boot by _HOME_MENU_APPLY.
[menu __main __settings __home_menu]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Home Menu

[menu __main __settings __home_menu __traditional]
type: command
name: {"Traditional  <" if (printer.save_variables.variables.home_menu_mode|default('traditional')) == 'traditional' else "Traditional"}
gcode:
    SAVE_VARIABLE VARIABLE=home_menu_mode VALUE='"traditional"'
    SET_DISPLAY_GROUP GROUP=_default_20x4
    M117 Home: Traditional
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __settings __home_menu __enhanced]
type: command
name: {"Enhanced     <" if (printer.save_variables.variables.home_menu_mode|default('traditional')) == 'enhanced' else "Enhanced"}
gcode:
    SAVE_VARIABLE VARIABLE=home_menu_mode VALUE='"enhanced"'
    SET_DISPLAY_GROUP GROUP=_default_20x4_enh
    M117 Home: Enhanced
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

# Re-apply the saved home layout after every boot (SET_DISPLAY_GROUP does not
# survive a restart).
[delayed_gcode _HOME_MENU_APPLY]
initial_duration: 2.
gcode:
  {% set mode = printer.save_variables.variables.home_menu_mode|default('traditional') %}
  {% set group = '_default_20x4_enh' if mode == 'enhanced' else '_default_20x4' %}
  SET_DISPLAY_GROUP GROUP={group}

### menu calibration ###
[menu __main __calibration]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Calibration

[menu __main __calibration __home]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Auto home
gcode: G28

# Prusa's calibrate Z
[menu __main __calibration __calibrate_z]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Calibrate Z
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    G1 X0 Y0
    G1 Z{max_z} F2000 #Update with Z height.
    FORCE_MOVE STEPPER=stepper_z Distance=10 Velocity=10
    G1 Z{max_z-20} F2000 # Move down
    G28 # Home again

[menu __main __calibration __mesh_leveling]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Mesh Bed Leveling
gcode: 
	BED_MESH_CLEAR
	BED_MESH_CALIBRATE 
	
[menu __main __calibration __hotend_pid_tuning]
type: command
enable: {(not printer.idle_timeout.state == "Printing") and ('extruder' in printer)}
name: Nozzle PID    (200)
gcode: PID_CALIBRATE HEATER=extruder TARGET=200 WRITE_FILE=1
    SAVE_CONFIG

[menu __main __calibration __hotbed_pid_tuning]
type: command
enable: {(not printer.idle_timeout.state == "Printing") and ('heater_bed' in printer)}
name: Bed PID       (60)
gcode: PID_CALIBRATE HEATER=heater_bed TARGET=60 WRITE_FILE=1
    SAVE_CONFIG

[menu __main __save_config]
type: disabled
name: Save Config

### menu support ###
# GET_HOST_IP is registered by the mk3s_menu_extras module - it resolves the
# host IP without shell access and saves it to save_variables as 'host_ip'.
[delayed_gcode _GET_HOST_IP_ON_BOOT]
initial_duration: 15.
gcode:
  GET_HOST_IP

[menu __main __support]
type: list
name: Support

[menu __main __support __ip]
type: command
name: {"IP: " + (printer.save_variables.variables.host_ip|default('n/a'))}
gcode:
