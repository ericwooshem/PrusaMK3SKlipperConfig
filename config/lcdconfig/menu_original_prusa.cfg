[menu __main __offsetz]
type: input
enable: {printer.idle_timeout.state == "Printing" or printer["gcode_macro first_layer_calibration"].calibrating == 1}
name: Live adjust Z{'%6.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.005
realtime: True
gcode:
  {% set sv = printer.save_variables.variables %}
  {% set sel = sv.selected_bed | default('smooth') %}
  {% set offvar = 'smooth_offset' if sel == 'smooth' else ('textured_offset' if sel == 'textured' else 'satin_offset') %}
  SET_GCODE_OFFSET Z={'%.3f' % menu.input} MOVE=1
  SAVE_VARIABLE VARIABLE={offvar} VALUE={'%.3f' % menu.input}

### menu tune ###
[menu __main __tune]
type: list
enable: {printer.idle_timeout.state == "Printing"}
name: Tune

[menu __main __tune __speed]
type: input
name: Speed:          {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.speed_factor}
input_min: 0.01
input_max: 5
input_step: 0.01
realtime: True
gcode:
    M220 S{'%d' % (menu.input*100)}
	
# Live acceleration multiplier (50-200%). Writes the multiplier into
# ACCEL_STATE.mult and re-applies the runtime accel limit immediately so the
# change takes effect without waiting for the next M204 from the slicer. The
# runtime limit is derived from the current one (scaled by the ratio of the
# new to old multiplier) so it stays consistent with what M204 will compute.
[menu __main __tune __accel]
type: input
name: Accel:          {'%3d' % (menu.input*100)}%
input: {printer["gcode_macro ACCEL_STATE"].mult}
input_min: 0.5
input_max: 2.0
input_step: 0.05
realtime: True
gcode:
    {% set old_mult = printer["gcode_macro ACCEL_STATE"].mult|default(1.0)|float %}
    {% set new_mult = menu.input|float %}
    {% set cur_accel = printer.toolhead.max_accel|float %}
    {% if old_mult > 0 %}
        {% set new_accel = cur_accel / old_mult * new_mult %}
    {% else %}
        {% set new_accel = cur_accel %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=ACCEL_STATE VARIABLE=mult VALUE={'%.3f' % new_mult}
    SET_VELOCITY_LIMIT ACCEL={'%.1f' % new_accel}

[menu __main __tune __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
name: {"Nozzle:         %3.0f" % (menu.input)}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 1
gcode: M104 T0 S{'%.0f' % menu.input}

[menu __main __tune __hotbed_target]
type: input
enable: {'heater_bed' in printer}
name: {"Bed:            %3.0f" % (menu.input)}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.config.heater_bed.max_temp}
input_step: 1
gcode: M140 S{'%.0f' % menu.input}
	
[menu __main __tune __fanspeed]
type: input
enable: {'fan' in printer}
name: Fan speed:      {'%3d' % (menu.input*255)}%
input: {printer.fan.speed}
input_min: 0
input_max: 1
input_step: 0.01
gcode:
    M106 S{'%d' % (menu.input*255)}

[menu __main __tune __flow]
type: input
name: Flow:           {'%5.1f' % (menu.input*100)}%
input: {printer.gcode_move.extrude_factor}
input_min: 0.01
input_max: 2
input_step: 0.01
realtime: True
gcode:
    M221 S{'%.1f' % (menu.input*100)}

[menu __main __tune __filament_change]
type: command
enable: {("pause_resume" in printer)}
name: Change Filament
gcode: M600
	
[menu __main __resume]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "paused"}
name: Resume printing
gcode:
    {% if "pause_resume" in printer %}
        RESUME
    {% else %}
        M24
    {% endif %}
    {menu.exit()}

[menu __main __pause]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "printing"}
name: Pause printing
gcode:
    {% if "pause_resume" in printer %}
        PAUSE
    {% else %}
        M25
    {% endif %}
	
[menu __main __cancel]
type: command
enable: {('virtual_sdcard' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Cancel printing
gcode:
    {% if 'pause_resume' in printer %}
        CANCEL_PRINT
    {% else %}
        M25
        M27
        M26 S0
        TURN_OFF_HEATERS
        {% if printer.toolhead.position.z <= printer.toolhead.axis_maximum.z - 5 %}
            G91
            G0 Z5 F1000
            G90
        {% endif %}
    {% endif %}
    {menu.exit()}

[menu __main __cancel_object]
type: exclobjlist
enable: {('exclude_object' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused") and printer.exclude_object.objects}
name: Cancel Object
	
