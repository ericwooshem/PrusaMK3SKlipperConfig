# Bed sheet selector: click to enter, scroll to cycle smooth/textured/satin,
# click again to apply. Selecting saves selected_bed and applies that sheet's
# stored offset (APPLY_BED_OFFSET). Mirrors Settings > Z Offset / Sheet.
[menu __main __sheet]
type: input
enable: {not printer.idle_timeout.state == "Printing"}
name: {%- set sheet = ['Smooth', 'Textured', 'Satin'][menu.input|int] -%}{"Sheet%*s[%s]" % (12 - sheet|length, '', sheet)}
input: {0 if (printer.save_variables.variables.selected_bed|default("smooth")) == "smooth" else (1 if (printer.save_variables.variables.selected_bed|default("smooth")) == "textured" else 2)}
input_min: 0
input_max: 2
input_step: 1
gcode:
    {% set sheets = ['smooth', 'textured', 'satin'] %}
    {% set sel = sheets[menu.input|int] %}
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"{sel}"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}

[menu __main __loadf]
type: list
name: Load Filament
enable: {('virtual_sdcard' in printer) and ("filament_switch_sensor fsensor" in printer) and ("gcode_macro LOAD_WIZARD" in printer) and (printer["filament_switch_sensor fsensor"].filament_detected == False) and ((not printer.idle_timeout.state == "Printing") or printer.print_stats.state == "paused")}

# Filament type scroll selector + live status. The 4 items always stay
# visible (menu enable filters only refresh on push/pop) so the wizard screen
# is one inline selector: click to edit, scroll to cycle PLA..FLEX, click to
# confirm and start heating. The status line re-renders each draw and shows
# Heating / Loading / Purging progress while the wizard runs.
[menu __main __loadf __type]
type: input
name: {%- set w = printer["gcode_macro LOAD_WIZARD"] -%}{%- if w.mode == 1 and w.step >= 1 -%}{%- if w.step == 1 -%}{"Heating... %3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target)}{%- elif w.step == 2 -%}{% if printer["filament_switch_sensor fsensor"].filament_detected %}{"Loading: %d mm" % w.extruded}{% else %}Insert Filament{% endif %}{%- elif w.step == 3 -%}{"Purging: %d mm" % w.purged}{%- endif -%}{%- else -%}{%- set t = ['PLA', 'PETG', 'ABS', 'ASA', 'PC', 'PVB', 'HIPS', 'PP', 'FLEX'][menu.input|int] -%}{"Filament%*s[%s]" % (9 - t|length, '', t)}{%- endif -%}
input: {%- set types = ['PLA', 'PETG', 'ABS', 'ASA', 'PC', 'PVB', 'HIPS', 'PP', 'FLEX'] -%}{%- set t = printer["gcode_macro LOAD_WIZARD"].type -%}{ types.index(t) if t in types else 0 }
input_min: 0
input_max: 8
input_step: 1
gcode:
    {% set types = ['PLA', 'PETG', 'ABS', 'ASA', 'PC', 'PVB', 'HIPS', 'PP', 'FLEX'] %}
    {% set temps = [215, 230, 255, 260, 275, 215, 220, 254, 230] %}
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step == 0 %}
        SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=type VALUE='"{types[menu.input|int]}"'
        M104 S{temps[menu.input|int]}
        UPDATE_DELAYED_GCODE ID=heat_loop DURATION=1
    {% endif %}

[menu __main __loadf __status]
type: command
name: {%- set w = printer["gcode_macro LOAD_WIZARD"] -%}{%- if w.mode == 1 and w.step == 1 -%}{"Heating: %3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target)}{%- elif w.mode == 1 and w.step == 2 -%}{% if printer["filament_switch_sensor fsensor"].filament_detected %}{"Loading: %d mm" % w.extruded}{% else %}Insert Filament{% endif %}{%- elif w.mode == 1 and w.step == 3 -%}{"Purging: %d mm" % w.purged}{%- else -%}Select a type{%- endif -%}
gcode:
    {% set types = ['PLA', 'PETG', 'ABS', 'ASA', 'PC', 'PVB', 'HIPS', 'PP', 'FLEX'] %}
    {% set temps = [215, 230, 255, 260, 275, 215, 220, 254, 230] %}
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step == 0 %}
        {% set idx = types.index(w.type) if w.type in types else 0 %}
        SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=1
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=type VALUE='"{types[idx]}"'
        M104 S{temps[idx]}
        UPDATE_DELAYED_GCODE ID=heat_loop DURATION=1
    {% endif %}

[menu __main __loadf __cancel]
type: command
name: Cancel
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step >= 1 or w.mode == 1 %}
        M400
        M104 S0
        CLEAR_DELAYED_GCODE ID=load_loop
        CLEAR_DELAYED_GCODE ID=heat_loop
        CLEAR_DELAYED_GCODE ID=purge_loop
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=0
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=0
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=auto VALUE=0
        M117 Load Cancelled
        UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
        {menu.exit()}
    {% endif %}

