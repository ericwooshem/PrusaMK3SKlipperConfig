# Auto-load wizard screen. Pushing filament into the fsensor triggers LOAD_FILAMENT, which
# opens the Load Filament menu (skipping the type picker when the nozzle goal temp is already
# at/above auto_load_min_temp) and runs an unattended heat -> 60mm feed -> 40mm purge.
# While that runs the extruder is moving so idle_timeout reads "Printing" and
# the regular Load/Unload/Purge entries hide, leaving only "Tune". This item
# is gated only on the wizard state (not idle_timeout) so it stays available,
# shows live progress (name re-renders every draw), and offers Cancel.
[menu __main __autoload]
type: list
enable: {("gcode_macro LOAD_WIZARD" in printer) and (printer["gcode_macro LOAD_WIZARD"].mode == 1) and (printer["gcode_macro LOAD_WIZARD"].step >= 1)}
name: {%- set w = printer["gcode_macro LOAD_WIZARD"] -%}{%- if w.step == 1 -%}{"Heating: %3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target)}{%- elif w.step == 2 -%}{"Loading: %d mm" % w.extruded}{%- elif w.step == 3 -%}{"Purging: %d mm" % w.purged}{%- else -%}Filament Loading{%- endif -%}

[menu __main __autoload __status]
type: command
name: {%- set w = printer["gcode_macro LOAD_WIZARD"] -%}{%- if w.step == 1 -%}{"Heating: %3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target)}{%- elif w.step == 2 -%}{"Loading: %d mm" % w.extruded}{%- elif w.step == 3 -%}{"Purging: %d mm" % w.purged}{%- else -%}Load finished{%- endif -%}
gcode: M117

# Cancel stops the wizard immediately: cut the heat, zero the step counter so
# the loops bail out, and reset the auto flag.
[menu __main __autoload __cancel]
type: command
name: Cancel
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step >= 1 %}
        M400
        M104 S0
        CLEAR_DELAYED_GCODE ID=load_loop
        CLEAR_DELAYED_GCODE ID=heat_loop
        CLEAR_DELAYED_GCODE ID=purge_loop
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=0
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=0
        SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=auto VALUE=0
        M117 Load Cancelled
        UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
        {menu.exit()}
    {% endif %}


