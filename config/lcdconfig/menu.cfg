[menu __main __loadf]
type: list
name: Load Filament
enable: {('virtual_sdcard' in printer) and ("filament_switch_sensor fsensor" in printer) and ("gcode_macro LOAD_WIZARD" in printer) and (printer["filament_switch_sensor fsensor"].filament_detected == False) and ((not printer.idle_timeout.state == "Printing") or printer.print_stats.state == "paused")}

[menu __main __loadf __title]
type: command
name: Loading Filament
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step >= 1}
gcode: M117

[menu __main __loadf __pla]
type: command
name: PLA  (215/60)
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step == 0}
gcode:
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=mode VALUE=1
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=1
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=type VALUE='"PLA"'
    M104 S215
    UPDATE_DELAYED_GCODE ID=heat_loop DURATION=1

