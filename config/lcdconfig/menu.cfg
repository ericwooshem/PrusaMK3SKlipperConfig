[menu __main __preheat __nozzle_cooldown]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Nozzle Cooldown
gcode:
    M104 S0
    {menu.exit()}
	
[menu __main __preheat __nozzle_cleaning]
type: command
