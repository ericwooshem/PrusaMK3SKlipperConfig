[menu __main __purgef __heat]
type: command
name: {"Heating: %3.0f/%3.0f" % (printer.extruder.temperature, printer.extruder.target)}
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step == 1}
gcode: M117

[menu __main __purgef __purging]
type: command
name: {"Purging: %d mm" % printer["gcode_macro LOAD_WIZARD"].purged}
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step == 2}
gcode: M117

[menu __main __purgef __done]
type: command
name: Done
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step == 2}
gcode:
    M400
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=0
    M117 Purge Complete!
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __purgef __cancel]
type: command
name: Cancel
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step >= 1}
gcode:
    M400
    M104 S0
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=0
    M117 Purge Cancelled
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}


### menu settings ###
[menu __main __settings]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Settings

[menu __main __settings __temperature]
type: list
name: Temperature

[menu __main __settings __temperature __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
name: {"Nozzle:         %3.0f" % (menu.input)}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 1
gcode: M104 T0 S{'%.0f' % menu.input}

[menu __main __settings __temperature __hotbed_target]
type: input
enable: {'heater_bed' in printer}
name: {"Bed:            %3.0f" % (menu.input)}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.config.heater_bed.max_temp}
input_step: 1
gcode: M140 S{'%.0f' % menu.input}
	
[menu __main __settings __temperature __fanspeed]
type: input
enable: {'fan' in printer}
name: Fan speed:      {'%3d' % (menu.input*255)}%
input: {printer.fan.speed}
input_min: 0
input_max: 1
input_step: 0.01
gcode:
    M106 S{'%d' % (menu.input*255)}
	
[menu __main __settings __move_1mm]
type: list
name: Move axis
enable: {not printer.idle_timeout.state == "Printing"}

[menu __main __settings __move_1mm __top_right]
type: command
name: Go to top-right
gcode:
    G28
    G1 X248 Y200 Z200
    M84


[menu __main __settings __move_1mm __axis_x]
type: input
name: Move X:       {'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.x}
input_min: {printer.toolhead.axis_minimum.x}
input_max: {printer.toolhead.axis_maximum.x}
input_step: 1.0
realtime: True
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 X{menu.input}
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __settings __move_1mm __axis_y]
type: input
name: Move Y:       {'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.y}
input_min: {printer.toolhead.axis_minimum.y}
input_max: {printer.toolhead.axis_maximum.y}
input_step: 1.0
realtime: True
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Y{menu.input}
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __settings __move_1mm __axis_z]
type: input
enable: {not printer.idle_timeout.state == "Printing"}
name: Move Z:       {'%05.1f' % menu.input}
input: {printer.gcode_move.gcode_position.z}
input_min: 0
input_max: {printer.toolhead.axis_maximum.z}
input_step: 1.0
realtime: True
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    G90
    G1 Z{menu.input}
    RESTORE_GCODE_STATE NAME=__move__axis

[menu __main __settings __move_1mm __axis_e]
type: input
enable: {not printer.idle_timeout.state == "Printing"}
name: Move E:      {'%+06.1f' % menu.input}
input: 0
input_min: -{printer.configfile.config.extruder.max_extrude_only_distance|default(50)}
input_max: {printer.configfile.config.extruder.max_extrude_only_distance|default(50)}
input_step: 1.0
realtime: True
gcode:
    SAVE_GCODE_STATE NAME=__move__axis
    M83
    G1 E{menu.input} F240
    RESTORE_GCODE_STATE NAME=__move__axis
	
[menu __main __settings __disable]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Disable steppers
gcode:
    M84
    M18
	
[menu __main __settings __bed_offset]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Z Offset / Sheet

# One entry per surface. Each sheet's offset is a single variable in
# save_variables (saved_variables.cfg): smooth_offset / textured_offset /
# satin_offset. Edit that *_offset number to tune a sheet, then restart.
# Tapping a sheet only records selected_bed and applies that sheet's
# offset; BED_OFFSET_APPLY in printer.cfg restores it after a reboot.
[menu __main __settings __bed_offset __smooth]
type: command
name: {"Smooth PEI  <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "smooth" else "Smooth PEI"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"smooth"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Smooth sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __settings __bed_offset __textured]
type: command
name: {"Textured    <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "textured" else "Textured"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"textured"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Textured sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

[menu __main __settings __bed_offset __satin]
type: command
name: {"Satin       <" if (printer.save_variables.variables.selected_bed|default("smooth")) == "satin" else "Satin"}
gcode:
    SAVE_VARIABLE VARIABLE=selected_bed VALUE='"satin"'
    APPLY_BED_OFFSET MOVE={1 if 'z' in printer.toolhead.homed_axes else 0}
    M117 Satin sheet
    UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
    {menu.exit()}

### menu calibration ###
[menu __main __calibration]
type: list
enable: {not printer.idle_timeout.state == "Printing"}
name: Calibration

[menu __main __calibration __home]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Auto home
gcode: G28

# Prusa's calibrate Z
[menu __main __calibration __calibrate_z]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Calibrate Z
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
    G1 X0 Y0
    G1 Z{max_z} F2000 #Update with Z height.
    FORCE_MOVE STEPPER=stepper_z Distance=10 Velocity=10
    G1 Z{max_z-20} F2000 # Move down
    G28 # Home again

[menu __main __calibration __mesh_leveling]
type: command
enable: {not printer.idle_timeout.state == "Printing"}
name: Mesh Bed Leveling
gcode: 
	BED_MESH_CLEAR
	BED_MESH_CALIBRATE 
	
[menu __main __calibration __hotend_pid_tuning]
type: command
enable: {(not printer.idle_timeout.state == "Printing") and ('extruder' in printer)}
name: Nozzle PID    (240)
gcode: PID_CALIBRATE HEATER=extruder TARGET=240 WRITE_FILE=1

[menu __main __calibration __hotbed_pid_tuning]
type: command
enable: {(not printer.idle_timeout.state == "Printing") and ('heater_bed' in printer)}
name: Bed PID       (100)
gcode: PID_CALIBRATE HEATER=heater_bed TARGET=100 WRITE_FILE=1

[menu __main __save_config]
type: command
name: Save Config
gcode: SAVE_CONFIG

### menu support ###
[menu __main __support]
type: list
name: Support

[menu __main __support __dump]
type: command
name: Dump params (to PC)
gcode:
   {% for name1 in printer %}
      {% for name2 in printer[name1] %}
         { action_respond_info("printer['%s'].%s = %s"
                               % (name1, name2, printer[name1][name2])) }
      {% else %}
         { action_respond_info("printer['%s'] = %s" % (name1, printer[name1])) }
      {% endfor %}
   {% endfor %}


