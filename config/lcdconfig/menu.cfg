[menu __main __loadf __loading_done]
type: command
name: Done - Purge
enable: {("gcode_macro LOAD_WIZARD" in printer) and printer["gcode_macro LOAD_WIZARD"].step == 2}
gcode:
    M400
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=3
    SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=purged VALUE=0
    UPDATE_DELAYED_GCODE ID=purge_loop DURATION=0.5

