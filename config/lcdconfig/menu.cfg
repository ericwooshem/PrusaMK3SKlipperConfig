# TEST CUSTOM LCD MENU ------------------------------------------------------START

[menu __main __octoprint]
type: list
name: OctoPrint
enable: False

[menu __main __control]
type: list
name: Control
enable: False

[menu __main __temp]
type: list
name: Temperature
enable: False

[menu __main __filament]
type: list
name: Filament
enable: False

### menu setup ###
[menu __main __setup]
type: list
name: Setup
enable: False

### menu virtual sdcard ###
[menu __main __sdcard]
type: vsdlist
enable: {('virtual_sdcard' in printer) and (not printer.idle_timeout.state == "Printing")}
name: SD Card

[menu __main __offsetz]
type: input
enable: {printer.idle_timeout.state == "Printing"}
name: Live adjust Z{'%6.3f' % menu.input}
input: {printer.gcode_move.homing_origin.z}
input_min: -5
input_max: 5
input_step: 0.005
realtime: True
gcode:
    {% set sv = printer.save_variables.variables %}
    {% set sel = sv.selected_bed | default('smooth') %}
    {% set offvar = 'smooth_offset' if sel == 'smooth' else ('textured_offset' if sel == 'textured' else 'satin_offset') %}
    SET_GCODE_OFFSET Z={'%.3f' % menu.input} MOVE=1
    SAVE_VARIABLE VARIABLE={offvar} VALUE={'%.3f' % menu.input}

### menu tune ###
[menu __main __tune]
type: list
enable: {printer.idle_timeout.state == "Printing"}
name: Tune

[menu __main __tune __speed]
type: input
name: Speed:          {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.speed_factor}
input_min: 0.01
input_max: 5
input_step: 0.01
realtime: True
gcode:
    M220 S{'%d' % (menu.input*100)}
	
[menu __main __tune __hotend0_target]
type: input
enable: {('extruder' in printer) and ('extruder' in printer.heaters.available_heaters)}
name: {"Nozzle:         %3.0f" % (menu.input)}
input: {printer.extruder.target}
input_min: 0
input_max: {printer.configfile.config.extruder.max_temp}
input_step: 1
gcode: M104 T0 S{'%.0f' % menu.input}

[menu __main __tune __hotbed_target]
type: input
enable: {'heater_bed' in printer}
name: {"Bed:            %3.0f" % (menu.input)}
input: {printer.heater_bed.target}
input_min: 0
input_max: {printer.configfile.config.heater_bed.max_temp}
input_step: 1
gcode: M140 S{'%.0f' % menu.input}
	
[menu __main __tune __fanspeed]
type: input
enable: {'fan' in printer}
name: Fan speed:      {'%3d' % (menu.input*255)}%
input: {printer.fan.speed}
input_min: 0
input_max: 1
input_step: 0.01
gcode:
    M106 S{'%d' % (menu.input*255)}

[menu __main __tune __flow]
type: input
name: Flow:           {'%3d' % (menu.input*100)}%
input: {printer.gcode_move.extrude_factor}
input_min: 0.01
input_max: 2
input_step: 0.01
realtime: True
gcode:
    M221 S{'%d' % (menu.input*100)}

[menu __main __tune __filament_change]
type: command
enable: {("pause_resume" in printer)}
name: Change Filament
gcode: M600
	
[menu __main __resume]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "paused"}
name: Resume printing
gcode:
    {% if "pause_resume" in printer %}
        RESUME
    {% else %}
        M24
    {% endif %}

[menu __main __pause]
type: command
enable: {('virtual_sdcard' in printer) and printer.print_stats.state == "printing"}
name: Pause printing
gcode:
    {% if "pause_resume" in printer %}
        PAUSE
    {% else %}
        M25
    {% endif %}
	
[menu __main __cancel]
type: command
enable: {('virtual_sdcard' in printer) and (printer.print_stats.state == "printing" or printer.print_stats.state == "paused")}
name: Cancel printing
gcode:
    {% if 'pause_resume' in printer %}
        CANCEL_PRINT
    {% else %}
        M25
        M27
        M26 S0
        TURN_OFF_HEATERS
        {% if printer.toolhead.position.z <= printer.toolhead.axis_maximum.z - 5 %}
            G91
            G0 Z5 F1000
            G90
        {% endif %}
    {% endif %}
    {menu.exit()}
	
### menu temperature ###
[menu __main __preheat]
type: list
name: Preheat
enable: {not printer.idle_timeout.state == "Printing"}

[menu __main __preheat __cooldown]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Cooldown
gcode:
    M104 S0
    M140 S0
    {menu.exit()}
	
[menu __main __preheat __part_removal]
type: command
enable: {('extruder' in printer) and ('heater_bed' in printer)}
name: Part Removal (55)
