# Filament management macros that are NOT present in the printer's main macro
# file. Copy these into the printer's macro file (or ensure this file is
# included) and use the updated menu items in menu_original_prusa.cfg.

# Filament wizard state. mode: 1=load, 2=unload, 3=purge.
# step: 0=select type, 1=heating, 2=action, 3=purge-after-load.
# The load/unload/purge submenus in menu_original_prusa.cfg set mode when a
# filament type is picked, then heat_loop advances to the matching action.
[gcode_macro LOAD_WIZARD]
description: Filament load/unload/purge wizard state
variable_mode: 0
variable_step: 0
variable_type: "PLA"
variable_extruded: 0
variable_purged: 0
variable_unloaded: 0
variable_auto: 0
gcode:
    M117

# Polls the nozzle temperature while the wizard is heating; once up to
# temperature it advances to the action loop matching the current mode
[delayed_gcode heat_loop]
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.step == 1 %}
        {% set ext = printer.extruder %}
        {% if ext.target > 0 and ext.temperature >= ext.target - 1 %}
            SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=2
            {% if w.mode == 1 %}
                {% if w.auto == 0 %}
                    M300 S300 P800
                    M117 Insert Filament
                {% endif %}
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=extruded VALUE=0
                UPDATE_DELAYED_GCODE ID=load_loop DURATION=0.5
            {% elif w.mode == 2 %}
                SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=0
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=unloaded VALUE=0
                UPDATE_DELAYED_GCODE ID=unload_loop DURATION=0.5
            {% elif w.mode == 3 %}
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=purged VALUE=0
                UPDATE_DELAYED_GCODE ID=purge_loop DURATION=0.5
            {% endif %}
        {% else %}
            UPDATE_DELAYED_GCODE ID=heat_loop DURATION=1
        {% endif %}
    {% endif %}

# Feeds filament in small steps while the wizard is loading; waits for the
# fsensor to trigger first (the user inserts the filament only after the
# heater is up to temperature), then stops at the fixed load distance.
# Auto-started loads (fsensor push-in) advance to the purge step at the cap.
[delayed_gcode load_loop]
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.mode == 1 and w.step == 2 %}
        {% if not printer["filament_switch_sensor fsensor"].filament_detected %}
            UPDATE_DELAYED_GCODE ID=load_loop DURATION=0.5
        {% elif w.extruded >= 300 %}
            {% if w.auto == 1 %}
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=3
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=purged VALUE=0
                UPDATE_DELAYED_GCODE ID=purge_loop DURATION=0.5
            {% endif %}
        {% else %}
            {% if w.auto == 1 %}
                M117 Loading: {w.extruded} mm
            {% endif %}
            G91
            G1 E3 F360
            G90
            SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=extruded VALUE={w.extruded + 3}
            UPDATE_DELAYED_GCODE ID=load_loop DURATION=0.5
        {% endif %}
    {% endif %}

# Retracts filament while the wizard is unloading; stops at the cap and
# re-enables the fsensor (it is disabled for the whole unload so that the
# runout trigger does not fire when the filament clears the sensor).
[delayed_gcode unload_loop]
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if w.mode == 2 and w.step == 2 %}
        {% if w.unloaded >= 150 %}
            SET_FILAMENT_SENSOR SENSOR=fsensor ENABLE=1
        {% else %}
            G91
            G1 E-5 F600
            G90
            SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=unloaded VALUE={w.unloaded + 5}
            UPDATE_DELAYED_GCODE ID=unload_loop DURATION=0.5
        {% endif %}
    {% endif %}

# Purges filament during a standalone purge (mode 3) or after a load (mode 1).
# Auto-started loads finish themselves once the purge cap is reached.
[delayed_gcode purge_loop]
gcode:
    {% set w = printer["gcode_macro LOAD_WIZARD"] %}
    {% if (w.mode == 1 and w.step == 3) or (w.mode == 3 and w.step == 2) %}
        {% if w.purged >= 100 %}
            {% if w.auto == 1 and w.mode == 1 %}
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=step VALUE=0
                SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=auto VALUE=0
                _SET_LOADED_FILAMENT TYPE={w.type}
                M117 Load Complete!
                UPDATE_DELAYED_GCODE ID=clear_display DURATION=10
            {% endif %}
        {% else %}
            {% if w.auto == 1 %}
                M117 Purging: {w.purged} mm
            {% endif %}
            G91
            G1 E3 F360
            G90
            SET_GCODE_VARIABLE MACRO=LOAD_WIZARD VARIABLE=purged VALUE={w.purged + 3}
            UPDATE_DELAYED_GCODE ID=purge_loop DURATION=0.5
        {% endif %}
    {% endif %}
