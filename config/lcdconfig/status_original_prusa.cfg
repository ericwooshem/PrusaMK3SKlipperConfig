# TEST CUSTOM LCD DISPLAY ------------------------------------------------------START

[display_template _print_status]
text:
  {% if printer.display_status.message %}
    { printer.display_status.message }
  {% elif printer.idle_timeout.printing_time %}
    #{% set pos = printer.toolhead.position %}
    #{ "X%-4.0fY%-4.0fZ%-5.2f" % (pos.x, pos.y, pos.z) }
    Prusa i3 MK3S OK.
  {% else %}
    Prusa i3 MK3S OK.
  {% endif %}
  
[display_template _heater_temperature]
param_heater_name: "extruder"
text:
  {% if param_heater_name in printer %}
    {% set heater = printer[param_heater_name] %}
    # Show glyph
    {% if param_heater_name == "heater_bed" %}
      {% if heater.target %}
        {% set frame = (printer.toolhead.estimated_print_time|int % 2) + 1 %}
        ~bed_heat{frame}~
      {% else %}
        ~bed~
      {% endif %}
    {% else %}
      ~extruder~
    {% endif %}
    # Show temperature
    { "%3.0f" % (heater.temperature,) }
    # Optionally show target
    {% if heater.target %}
      /
      { "%0.0f" % (heater.target,) }
    {% endif %}
    ~degrees~
  {% endif %}
  
[display_template _z_position]
text:
	Z
	{% if "z" not in printer.toolhead.homed_axes %}
		{ "   --- " }
	{% else %}
		{% if printer.idle_timeout.state == "Printing" %}
			{% set pos = printer.gcode_move.gcode_position %}
		{% else %}
			{% set pos = printer.toolhead.position %}
		{% endif %}
		{ "%6.2f" % (pos.z) }
	{% endif %}

[display_data _default_20x4 extruder]
position: 0, 0
text: { render("_heater_temperature", param_heater_name="extruder") }

[display_data _default_20x4 heater_bed]
position: 1,0
text: { render("_heater_temperature", param_heater_name="heater_bed") }

[display_data _default_20x4 z_position]
position: 0, 12
text: { render("_z_position") }

[display_data _default_20x4 fan]
position: 2, 6
text:
#  {% if 'fan' in printer %}
#    ~fan~
#    { "{:^4.0%}".format(printer.fan.speed) }
#  {% endif %}

[display_data _default_20x4 print_progress]
position: 2, 0
text:
  {% if printer.idle_timeout.state == "Printing" %}
    {% if 'virtual_sdcard' in printer %}
      #~sd~
	SD
    {% else %}
      #~usb~
	USB
    {% endif %}
	{ "{:^4.0%}".format(printer.display_status.progress) }
  {% else %}
    {% set sel = printer.save_variables.variables.selected_bed | default('smooth') %}
    { sel.title() }
  {% endif %}

[display_data _default_20x4 speed_factor]
position: 1, 12
text:
  ~feedrate~
  { "{:^4.0%}".format(printer.gcode_move.speed_factor) }

[display_data _default_20x4 printing_time]
position: 2, 12
text:
  ~clock~
  { render("_slicer_time") }

[display_data _default_20x4 print_filename]
position: 3, 0
text: { render("_print_filename") }

[display_template _slicer_time]
text:
  {% set m73 = printer["gcode_macro M73"] if "gcode_macro M73" in printer else {} %}
  {% if printer.idle_timeout.state == "Printing" and m73.r is defined and m73.r > 0 %}
    { "%02d:%02d" % (m73.r // 60, m73.r % 60) }
  {% else %}
    { "--:--" }
  {% endif %}

[display_template _printing_time]
text:
  {% if printer.idle_timeout.state == "Printing" and 'virtual_sdcard' in printer and printer.virtual_sdcard.progress > 0 %}
    {% set ptime = printer.print_stats.print_duration / printer.virtual_sdcard.progress * (1 - printer.virtual_sdcard.progress) %}
    { "%02d:%02dK" % (ptime // (60 * 60), (ptime // 60) % 60) }
  {% else %}
    { "--:--K" }
  {% endif %}

# Enhanced home layout templates ----------------------------------------------------
[display_template _xyz_position]
text:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    X---Y---Z---
  {% else %}
    {% set pos = printer.gcode_move.gcode_position if printer.idle_timeout.state == "Printing" else printer.toolhead.position %}
    { "X%3.0fY%3.0fZ%3.0f" % (pos.x, pos.y, pos.z) }
  {% endif %}

# Combined slicer + klipper remaining time. Reuses _slicer_time (MM:SS) and
# _printing_time (HH:MM), stripping their trailing S/K letters.
[display_template _times_combined]
text:
  S{ render("_slicer_time").replace('\n','')[0:5] }K{ render("_printing_time").replace('\n','')[0:5] }

# Current/last print filename shown on the bottom status row. Long names are
# scrolled by the mk3s_menu_extras display patch (stock Klipper has no
# status-screen scrolling). While a print is running the filename always wins,
# so a stale M117 message (e.g. a leftover "Prusa i3 MK3S ready.") cannot
# replace it mid-print. When not actively printing an M117 message takes over
# the row so warnings stay visible (e.g. the PRINT_START filament-mismatch
# warning or M600's "Swap filament now"); the filename returns once the
# message is cleared.
[display_template _print_filename]
text:
  {% set fn = printer.print_stats.filename %}
  {% if printer.display_status.message and printer.print_stats.state != "printing" %}
    { printer.display_status.message }
  {% elif fn %}
    { fn }
  {% endif %}

# Current/target temperature like the traditional readout, but without the
# degrees symbol so the 12-char X/Y/Z and S/K readouts fit on the same 20-col
# rows. Bed keeps the animated heating glyph.
[display_template _heater_temperature_cur]
param_heater_name: "extruder"
text:
  {% if param_heater_name in printer %}
    {% set heater = printer[param_heater_name] %}
    {% if param_heater_name == "heater_bed" %}
      {% if heater.target %}
        {% set frame = (printer.toolhead.estimated_print_time|int % 2) + 1 %}
        ~bed_heat{frame}~
      {% else %}
        ~bed~
      {% endif %}
    {% else %}
      ~extruder~
    {% endif %}
    { "%3.0f" % (heater.temperature,) }
    {% if heater.target %}
      /{ "%0.0f" % (heater.target,) }
    {% endif %}
  {% endif %}

# Enhanced home layout: nozzle temp | X Y Z, bed temp | S/K times, sheet | speed/accel
[display_data _default_20x4_enh extruder]
position: 0, 0
text: { render("_heater_temperature_cur", param_heater_name="extruder") }

[display_data _default_20x4_enh heater_bed]
position: 1, 0
text: { render("_heater_temperature_cur", param_heater_name="heater_bed") }

[display_data _default_20x4_enh xyz_position]
position: 0, 8
text: { render("_xyz_position") }

[display_data _default_20x4_enh times]
position: 1, 8
text: { render("_times_combined") }

[display_data _default_20x4_enh sheet]
position: 2, 0
text:
  {% set sel = printer.save_variables.variables.selected_bed | default('smooth') %}
  { sel.title() }

[display_data _default_20x4_enh speed_accel]
position: 2, 9
text:
  ~feedrate~{ "%3.0f%% A%3.0f%%" % (printer.gcode_move.speed_factor * 100, printer["gcode_macro ACCEL_STATE"].mult * 100) }

[display_data _default_20x4_enh print_filename]
position: 3, 0
text: { render("_print_filename") }

[display_glyph feedrate]
hd44780_slot: 3
hd44780_data:
  .....
  ..*..
  *..*.
  .*..*
  *..*.
  ..*..
  .....
  .....

[display_glyph fan]
hd44780_slot: 7
hd44780_data:
  .....
  **..*
  .*.**
  ..*..
  **.*.
  *..**
  .....
  .....


# TEST CUSTOM LCD DISPLAY ------------------------------------------------------END
